name: Daily levels analysis

on:
  schedule:
    - cron: "33 14 * * *"   # 17:33 Kenya time (EAT = UTC+3)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/analyze.py
      - name: Commit levels
        run: |
          git config user.name "levels-bot"
          git config user.email "levels-bot@users.noreply.github.com"
          git add data/levels.json
          git diff --cached --quiet || (git commit -m "Daily levels $(date -u +%F)" && git push)
